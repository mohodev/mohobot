components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session token
      description: Admin session token from POST /api/auth/login or POST /api/auth/session.
  schemas:
    ApiError:
      type: object
      required:
      - ok
      - error
      properties:
        ok:
          type: boolean
          enum:
          - false
        error:
          type: string
    OkResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
          enum:
          - true
      additionalProperties: true
      description: 'Success envelope. Additional fields are operation-specific; see each operation. Unknown/complex domain
        objects are returned as objects (additionalProperties: true) until their schemas are refined.'
    SessionTokenResponse:
      type: object
      required:
      - ok
      - token
      properties:
        ok:
          type: boolean
          enum:
          - true
        token:
          type: string
        auth:
          type: object
          additionalProperties: true
        masterToken:
          type: string
          description: Only returned by POST /api/setup/init, shown once.
    Confirmation:
      type: object
      required:
      - ok
      - confirmation
      properties:
        ok:
          type: boolean
          enum:
          - true
        confirmation:
          type: object
          additionalProperties: true
        target:
          type: object
          additionalProperties: true
