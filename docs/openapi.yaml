openapi: 3.0.3
info:
  title: MohoBot Admin API
  version: 1.0.0
  description: MohoBot Admin API. Single source of truth for the admin HTTP API; see docs/OPENAPI.md for the standard. Paths,
    methods, permissions, risk and confirmation are copied from src/admin/route-policy.ts and src/admin/server.ts, not invented.
servers:
- url: http://127.0.0.1:3210
  description: Admin server (loopback only; use an HTTPS reverse proxy for remote access)
tags:
- name: Auth
- name: Setup
- name: Status
- name: Bots
- name: Models
- name: Providers
- name: Extensions
- name: Memory
- name: Knowledge
- name: World
- name: Device
