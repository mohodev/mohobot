      tags:
      - Admin
      summary: admin.actions.read
      operationId: admin.actions.read
      x-moho-action: admin.actions.read
      x-moho-permission: admin.actions.read
      x-moho-risk: read
      x-moho-confirmation: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Invalid input
