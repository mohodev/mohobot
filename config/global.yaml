# MohoBot global runtime configuration.
# Secrets belong in .env only. Provider defaults live in data/provider.yaml.

logLevel: info

storage:
  driver: sqlite
  path: ./data/mohobot.db

supervisor:
  autoRestart: true
  maxRestarts: 10
  restartWindowMs: 300000
  backoffBaseMs: 1000
  backoffMaxMs: 60000
  crashOnUnhandled: false
  shutdownTimeoutMs: 10000

hotReload:
  enabled: true
  paths:
    - config
    - data/provider.yaml
    - data/provider.local.yaml
    - data/config.json
    - plugins
  debounceMs: 300

plugins:
  enabled: true
  dir: ./plugins
  allow: []
  deny: []
  hookTimeoutMs: 30000
  maxErrors: 5

session:
  maxMessages: 20
  maxChars: 8000
  ttlSeconds: 3600
  scope: user
  persist: true
