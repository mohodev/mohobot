# MohoBot Kilo.ai Provider Configuration

# 切换到 Kilo.ai 提供商（已对接完成）
ai:
  provider: kilo
  baseUrl: https://api.kilo.ai/api/gateway/
  model: tencent/hy3:free
  temperature: 0.8
  maxTokens: 1024
  timeoutMs: 60000
  retries: 2
  retryBaseDelayMs: 500
  stream: false

