# One file per bot. The filename stem is the bot id when "id" is omitted.
# Token comes from DISCORD_TOKEN or MOHO_BOT_MAIN_DISCORD_TOKEN - never from here.
# AI provider config lives in data/provider.yaml (AstrBot-style), not here.

id: main
name: MohoBot
enabled: true
# discord = real gateway; console = local stdin/stdout smoke test
adapter: discord

systemPromptFile: data/prompts/moho-system.md

discord:
  respondToMentionsOnly: true
  respondToDM: true
  allowedGuilds: []
  allowedChannels: []
  blockedUsers: []
  ignoreBots: true
  typingIndicator: true
  maxReplyLength: 1900

session:
  scope: user
  maxMessages: 20

disabledPlugins: []

rateLimit:
  enabled: true
  windowMs: 10000
  max: 3
