# One file per bot. The filename stem is the bot id when "id" is omitted.
# Token comes from DISCORD_TOKEN or MOHO_BOT_MAIN_DISCORD_TOKEN - never from here.
# AI provider config lives in data/provider.yaml (AstrBot-style), not here.

id: main
name: 墨染荷韵

# Only this designated administrator persona may process `?` commands.
# Put actual Discord user IDs here; everyone else receives no response.
admin:
  enabled: true
  # Emergency break-glass owner only. Normal Discord admin access is role-based.
  userIds:
    - "1352719954222383115"
  roleNames:
    - "Bot 管理"
  guildIds:
    - "1535564960929681418"

# Optional coarse public activity in Discord, projected from the character
# world state. It never exposes relationship scores, diary text or exact device data.
presence:
  enabled: false
  updateIntervalSeconds: 300
enabled: true
# discord = real gateway; console = local stdin/stdout smoke test
adapter: discord

systemPromptFile: data/prompts/moho-system.md

discord:
  # Observe group conversation and let the local social decision choose whether to speak.
  respondToMentionsOnly: false
  respondToDM: true
  allowedGuilds: []
  allowedChannels: []
  blockedUsers: []
  ignoreBots: true
  # Fellow RP bots allowed to banter with Moho (Discord user IDs).
  peerBots: []
  typingIndicator: true
  maxReplyLength: 1900
  # #记录：only redacted failures and lifecycle warnings, never chat bodies.
  logChannelId: "1538031083893817345"

session:
  # One shared timeline per group/channel, so the persona can follow the room.
  scope: channel
  maxMessages: 20

# Persist successful exchanges for safe semantic recall; embeddings remain optional.
memory:
  enabled: true
  adapter: semantic

disabledPlugins: []

rateLimit:
  enabled: true
  windowMs: 10000
  max: 3
