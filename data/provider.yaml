# MohoBot AI provider configuration (AstrBot-style).
# Provider-level AI settings live here instead of inside each bot config.
# Secrets use ${ENV_VAR} placeholders resolved from the environment at load.
# Priority: defaults < this file < data/config/global.yaml ai < per-bot ai < env vars.

provider: kilo
# Keep the tracked default aligned with the deployed Kilo model. Do not silently select another gateway model.
model: tencent/hy3:free
# tencent/hy3:free spends completion tokens on reasoning; fixed ceilings (1024,
# 2048, even 4096) kept starving the reply ("reasoning chain consumed the token
# budget"). 0 omits max_tokens entirely - no local output cap, the gateway/model
# limit is whatever Kilo enforces.
baseUrl: https://apx.ntbsd.eu.org/v1
apiKey: ${KILO_API_KEY}
temperature: 0.8
options:
  # 34 application RPM leaves six requests per minute for retries and bursts
  # against a 40 RPM endpoint such as NVIDIA NIM Free.
  budget:
    rpm: 34
    reserveRpm: 6
    maxConcurrent: 4
