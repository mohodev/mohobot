# MohoBot AI provider configuration (AstrBot-style).
# Provider-level AI settings live here instead of inside each bot config.
# Secrets use ${ENV_VAR} placeholders resolved from the environment at load.
# Priority: defaults < this file < global.yaml ai < per-bot ai < env vars.

provider: kilo
model: stepfun/step-3.7-flash:free
baseUrl: https://api.kilo.ai/api/gateway/v1
apiKey: ${KILO_API_KEY}
temperature: 0.8
options:
  # 34 application RPM leaves six requests per minute for retries and bursts
  # against a 40 RPM endpoint such as NVIDIA NIM Free.
  budget:
    rpm: 34
    reserveRpm: 6
    maxConcurrent: 4
    maxTokens:
      reply: 700
      vision: 450
      planner: 250
      reflection: 350
      profile: 300
      world: 700
      admin: 500
