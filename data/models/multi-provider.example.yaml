# All profiles are OpenAI-compatible. Keep each API key in .env.local.
# Add this under ai.options in data/provider.yaml or global config.
profiles:
  nim-main:
    baseUrl: https://apx.ntbsd.eu.org/nim/v1
    apiKey: ${NVIDIA_API_KEY}
    model: meta/llama-3.3-70b-instruct
    budget: { rpm: 34, reserveRpm: 6, maxConcurrent: 4 }
  kilo-fast:
    baseUrl: https://apx.ntbsd.eu.org/v1
    apiKey: ${KILO_API_KEY}
    model: stepfun/step-3.7-flash:free
    budget: { rpm: 0, maxConcurrent: 3 }
  local-vision:
    baseUrl: http://127.0.0.1:11434/v1
    apiKey: ''
    model: llava
    budget: { rpm: 0, maxConcurrent: 1 }

defaultProfile: nim-main
taskRoutes:
  reply: { primary: nim-main, fallback: kilo-fast }
  vision: { primary: local-vision, fallback: nim-main }
  planner: { primary: kilo-fast, fallback: nim-main }
  reflection: { primary: kilo-fast }
  profile: { primary: kilo-fast }
  world: { primary: kilo-fast, fallback: nim-main }
  admin: { primary: nim-main, fallback: kilo-fast }
